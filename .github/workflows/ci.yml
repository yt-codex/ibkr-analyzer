name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile app.py ibkr_analyzer/report_utils.py tests/test_app_helpers.py tests/test_report_fixture.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
